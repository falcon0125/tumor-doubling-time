name: Deploy to GitHub Pages

on:
  push:
    branches:
      - react # Trigger the workflow on pushes to the react branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Use a Linux environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Checkout the repository code

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Set up Node.js environment
        with:
          node-version: '20' # Specify Node.js version

      - name: Install dependencies
        run: npm install # Install project dependencies

      - name: Build project
        run: npm run build # Build the project (assuming you have a build script in package.json)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4 # Use the GitHub Pages deployment action
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # Use the default GitHub token
          publish_dir: ./dist # Specify the directory to publish (assuming your build output is in ./dist)
          publish_branch: gh-pages # Deploy to the gh-pages branch
          # cname: # Optional: Add a custom domain if needed
